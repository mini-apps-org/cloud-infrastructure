apiVersion: v1
kind: ConfigMap
metadata:
  name: league-service-config
  namespace: league
data:
  APP_ENV: "production"

  # Overrides server.port (5001) in the embedded production.yaml, since config.go
  # reads PORT last. 9200 is league-be's own number (.env, Dockerfile EXPOSE).
  PORT: "9200"

  # 127.0.0.1 is the cloud-sql-proxy sidecar, not Cloud SQL, so sslmode=disable is
  # loopback inside the pod -- the proxy makes the TLS connection upstream.
  DB_HOST: "127.0.0.1"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_SSLMODE: "disable"
  DB_NAME: "league-backend"

  # DATABASE_URL is deliberately absent: ConnectDatabaseString() PREFERS it over
  # every DB_* value, so defining it here at all silently bypasses the proxy DSN.

  # Cloudflare's edge, not the load balancer: the app only uses this to build URLs
  # it hands a browser, so it must be what the browser can reach.
  BASE_URL: "https://be.mvip-league.com"

  # TODO: the real SPA origin (league-fe). Doubles as post-login redirect target
  # and the only allowed CORS origin (middleware/cors.go), so a wrong value breaks
  # login and every browser XHR -- visible only in the browser console.
  FRONTEND_URL: "http://localhost:5174"

  SESSION_TTL: "12h"
  SESSION_IDLE_TTL: "30m"

  # Empty means any Google account may log in. Set a Workspace domain to restrict.
  GOOGLE_ALLOWED_HD: ""

  ENCRYPTION_KEY_VERSION: "1"

  GOOGLE_OAUTH_REDIRECT_URL: "https://be.mvip-league.com/api/v1/auth/google/callback"
