apiVersion: apps/v1
kind: Deployment
metadata:
  name: league-service
  namespace: league
  labels:
    app: league-service
spec:
  # BLOCKER: the single e2-medium has no room for this pod. ~701m of 940m
  # allocatable CPU goes to GKE system pods, and auth-service (150m) plus
  # recommendations-service (75m) take the rest. This Deployment is reserved
  # config, not a schedulable workload, until the node pool grows -- see
  # docs/league-service/prerequisites.md.
  replicas: 1
  selector:
    matchLabels:
      app: league-service
  # maxUnavailable MUST be 1 here, not 0: two copies of this pod do not fit on
  # one e2-medium, and 0/1 deadlocks (the old pod cannot go until the new one is
  # Ready, the new one cannot schedule until the old one goes). Flip to 0/1 once
  # the node pool has room.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: league-service
    spec:
      serviceAccountName: league-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # cloud-sql-proxy is a NATIVE sidecar (initContainer + restartPolicy:
      # Always), not an ordinary container. Load-bearing: main.go calls
      # db.Connect before serving and log.Fatalf's on failure, so a plain sidecar
      # lets the app lose the startup race and crashloop. Needs Kubernetes 1.29+.
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--port=5432"
            # The DB port stays on loopback. The health server is what kubelet
            # probes, so it alone listens on the pod IP.
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "--http-port=9090"
            # The same shared instance as auth-service and
            # recommendations-service, a different logical database.
            - "vincent-mini-apps-project:asia-southeast1:recommendations-app-instance"
          # No --credentials-file: Workload Identity supplies the token via the
          # bound KSA.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              # Matched to recommendations-service, not auth-service: 25m + 50m is
              # the leanest pair that still starts. The proxy is near-idle once
              # the pool is established and can burst to the 200m limit.
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # NOT tcpSocket on 5432: kubelet dials the pod IP from outside the
          # pod's network namespace, while the proxy binds 127.0.0.1 only -- that
          # probe can never pass.
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 30

      containers:
        - name: league-service
          # TODO: no image has been pushed to league-repository yet. Both other
          # services pin an immutable digest, because a moved tag makes
          # `kubectl rollout undo` meaningless -- append @sha256:... here once
          # league-be's release workflow has built 0.1.0 (it fires on a git tag
          # matching *.*.*), and keep ENV_IMAGE in configmap.yaml in step.
          image: asia-southeast1-docker.pkg.dev/vincent-mini-apps-project/league-repository/league-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          envFrom:
            - configMapRef:
                name: league-service-config
            # Four keys. DB_PASSWORD is used at runtime; the three OAuth/crypto
            # keys are required by config.Load() regardless, which rejects an
            # empty GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET or
            # ENCRYPTION_KEY before anything checks whether a route uses them.
            - secretRef:
                name: league-service-secrets
          securityContext:
            # runAsUser is deliberately unset: the distroless :nonroot tag
            # already sets numeric 65532, which is what lets runAsNonRoot be
            # verified. Restating it as a name would break that check.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /api/v1/health only marshals config strings and never touches the
          # pool, so one slow query cannot evict a healthy pod -- and a green
          # probe says nothing about the schema. CORS does not interfere: kubelet
          # sends no Origin header.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
