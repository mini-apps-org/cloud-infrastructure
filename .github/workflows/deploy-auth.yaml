name: Deploy auth-service

on:
  push:
    branches:
      - master
    paths:
      - "helm/values/auth.yaml"
      - "helm/mini-app-service/**"
  # Re-run by hand, e.g. after changing deploy-service.yaml. Only from master:
  # the deployer binding rejects any other ref.
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yaml
    with:
      service: auth
      cluster: vincent-cluster
    permissions:
      contents: read
      id-token: write
