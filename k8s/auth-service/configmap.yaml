apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: auth
data:
  APP_ENV: "production"

  # Wins over server.port in the embedded production.yaml (config.go reads PORT
  # last). Set explicitly so the manifest, not the baked-in config, owns the port.
  PORT: "9999"

  # 127.0.0.1 is the cloud-sql-proxy sidecar, not Cloud SQL. sslmode=disable is
  # correct and not a weakening: this hop is loopback inside the pod, and the
  # proxy makes the TLS connection to Cloud SQL itself.
  DB_HOST: "127.0.0.1"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "recommendations-backend"
  DB_SSLMODE: "disable"

  # Cloudflare's edge, not the load balancer: the app only uses this to build
  # URLs it hands a browser, so it must be what the browser can reach.
  BASE_URL: "https://auth.vincentn.dev"

  # Must match the registered Authorized redirect URI byte for byte. NOTE: the
  # 0.1.1 image ignores this -- config.go overrides BASE_URL and FRONTEND_URL but
  # not this, so the embedded localhost value still wins. See
  # docs/auth-service/phase-2-ingress-cloudflare.md step 9a.
  GOOGLE_OAUTH_REDIRECT_URL: "https://auth.vincentn.dev/api/v1/auth/google/callback"

  # TODO: the real SPA origin, before login is usable. Doubles as post-login
  # redirect target AND the only allowed CORS origin (main.go), so a wrong value
  # breaks login and every XHR at once -- the latter only in the browser console.
  FRONTEND_URL: "http://localhost:5173"

  SESSION_TTL: "12h"
  SESSION_IDLE_TTL: "30m"
