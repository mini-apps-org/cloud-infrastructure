apiVersion: v1
kind: ServiceAccount
metadata:
  name: league-service
  namespace: league
  annotations:
    # Binds this KSA to the GSA that holds roles/cloudsql.client. The pair must
    # also be bound the other way (roles/iam.workloadIdentityUser on the GSA),
    # or the proxy gets a token for the node SA instead and Cloud SQL rejects it.
    # One identity per workload, like auth-sql and recommendations-sql: a future
    # grant to one service must not widen the others.
    #
    # TODO: this GSA does not exist yet -- create it and both bindings before the
    # first apply (docs/league-service/deploy.md step 2).
    iam.gke.io/gcp-service-account: league-sql@vincent-mini-apps-project.iam.gserviceaccount.com
