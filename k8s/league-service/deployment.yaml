apiVersion: apps/v1
kind: Deployment
metadata:
  name: league-service
  namespace: league
  labels:
    app: league-service
spec:
  # GKE system pods take ~701m of the node's 940m allocatable CPU; the ~240m left
  # fits this pod's 75m plus a surge replica. Still ONE spot node, so preemption
  # is a full outage for this service.
  replicas: 1
  selector:
    matchLabels:
      app: league-service
  # 0/1 -- the OPPOSITE of auth-service and recommendations-service, which must use
  # 1/0 because two copies do not fit on their shared node (maxUnavailable: 0
  # deadlocks there). The free ~240m here makes a gapless rollout possible instead.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: league-service
    spec:
      serviceAccountName: league-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # NATIVE sidecar (initContainer + restartPolicy: Always), not an ordinary
      # container, and load-bearing: main.go log.Fatalf's if db.Connect fails, so a
      # plain sidecar loses the startup race and crashloops. Needs Kubernetes 1.29+.
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--port=5432"
            # The DB port stays on loopback; only the health server kubelet probes
            # listens on the pod IP.
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "--http-port=9090"
            # league's OWN instance -- NOT the shared recommendations-app-instance
            # that auth-service and recommendations-service point at.
            - "vincent-mini-apps-project:asia-southeast1:league-app-instance"
          # No --credentials-file: Workload Identity supplies the token via the
          # bound KSA.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              # 25m + 50m is the leanest pair that still starts (matched to
              # recommendations-service). The proxy is near-idle once the pool is
              # established and can burst to the 200m limit.
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # NOT tcpSocket on 5432: kubelet dials the pod IP from outside the pod's
          # network namespace, and the proxy binds 127.0.0.1 only.
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 30

      containers:
        - name: league-service
          # Digest-pinned like the other two services: a moved tag would make
          # `kubectl rollout undo` meaningless. The tag is the only version source
          # -- the binary reports it from an -ldflags-stamped value.
          image: asia-southeast1-docker.pkg.dev/vincent-mini-apps-project/league-repository/league-service:0.3.0@sha256:ff6a31e3395414ed2ba59d2c859cc552756c04acd6bd429d229b9ec0b4f6b896
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          envFrom:
            - configMapRef:
                name: league-service-config
            # Four keys. Only DB_PASSWORD is used at runtime, but config.Load()
            # rejects an empty GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET or
            # ENCRYPTION_KEY before anything checks whether a route uses them.
            - secretRef:
                name: league-service-secrets
          securityContext:
            # runAsUser is deliberately unset: the distroless :nonroot tag already
            # sets numeric 65532, which is what lets runAsNonRoot be verified.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # /api/v1/health only marshals config strings and never touches the pool,
          # so a slow query cannot evict a healthy pod -- and a green probe says
          # nothing about the schema. kubelet sends no Origin header, so CORS is moot.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
