apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mini-app-service.labels" . | nindent 4 }}
  annotations:
    # Binds this KSA to the GSA that holds roles/cloudsql.client. The pair must
    # also be bound the other way (roles/iam.workloadIdentityUser on the GSA),
    # or the proxy gets a token for the node SA instead and Cloud SQL rejects it.
    iam.gke.io/gcp-service-account: {{ required "gcpServiceAccount is required" .Values.gcpServiceAccount }}
