apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendations-service-config
  namespace: recommendations
data:
  APP_ENV: "production"
  PORT: "9998"

  # 127.0.0.1 is the cloud-sql-proxy sidecar, not Cloud SQL. sslmode=disable is
  # correct: this hop is loopback inside the pod, and the proxy makes the TLS
  # connection to Cloud SQL itself.
  DB_HOST: "127.0.0.1"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "recommendations-backend"
  DB_SSLMODE: "disable"
  # Cloudflare's edge, not the load balancer: the app only uses this to build
  # URLs it hands a browser, so it must be what the browser can reach.
  BASE_URL: "https://recommendations-be.vincentn.dev"

  # TODO: the real SPA origin. This is the ONLY allowed CORS origin
  # (middleware/cors.go, with AllowCredentials: true), so a wrong value breaks
  # every browser XHR -- visible only in the browser console, never in the logs.
  FRONTEND_URL: "http://localhost:5173"