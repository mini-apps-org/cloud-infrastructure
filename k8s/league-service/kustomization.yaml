apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: league

resources:
  - namespace.yaml
  - service-account.yml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# league-service-secrets is deliberately NOT here. It is created imperatively
# (docs/league-service/deploy.md step 5) so that no credential ever lands in this
# repository.

labels:
  # includeSelectors must stay false: true would inject these into the immutable
  # selector.matchLabels.
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: league-service
      app.kubernetes.io/part-of: mini-apps
